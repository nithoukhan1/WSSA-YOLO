# Wrist-PriViD V3
# Experiment: V3-B1-S42
#
# Controlled data-protocol experiment:
# The only intended change from the verified V2 baseline is replacing
# the 28,408-image offline-augmented training set with the 14,204
# original-image training set.

experiment:
  id: V3-B1-S42
  stage: strong_single_view_baseline
  description: >
    Controlled YOLO11s baseline trained using only the 14,204 original
    GRAZPEDWRI-DX training images. All training hyperparameters are
    preserved from the verified V2 baseline.
  branch: v3-strong-baseline
  seed: 42
  test_partition_allowed: false

data:
  dataset_name: GRAZPEDWRI-DX
  number_of_classes: 9

  dataset_root_environment_variable: GRAZPEDWRI_ROOT

  runtime_train_list: /kaggle/working/wrist_privid_v3/train_original.txt
  runtime_data_yaml: /kaggle/working/wrist_privid_v3/grazped_original_only.yaml

  train_source: original_only
  train_directory: data/images/train_aug
  train_allowed_prefix: "orig_"
  train_forbidden_prefix: "aug_"
  expected_train_images: 14204

  validation_directory: data/images/valid
  expected_validation_images: 4094

  class_names:
    0: boneanomaly
    1: bonelesion
    2: foreignbody
    3: fracture
    4: metal
    5: periostealreaction
    6: pronatorsign
    7: softtissue
    8: text

model:
  architecture: yolo11s
  pretrained_weights: yolo11s.pt
  number_of_classes: 9
  custom_modules_enabled: false

environment_flags:
  USE_FOCALER: "0"
  USE_WHFE: "0"
  USE_CBLOSS: "0"
  USE_MCAUX: "0"

training:
  image_size: 1024
  epochs: 100
  patience: 50

  batch_size: 16
  device: 0
  workers: 4

  optimizer: SGD
  initial_learning_rate: 0.01
  final_learning_rate_fraction: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cosine_learning_rate: true

  amp: true
  deterministic: true
  seed: 42

loss:
  box_gain: 7.5
  classification_gain: 2.5
  dfl_gain: 1.5
  classification_positive_weight: 0.0

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0

  flip_vertical: 0.0
  flip_horizontal: 0.5

  mosaic: 1.0
  mixup: 0.0
  close_mosaic_epochs: 15

validation:
  enabled: true
  split: val
  image_size: 1024
  confidence_threshold: 0.001
  iou_threshold: 0.70
  maximum_detections: 300
  test_time_augmentation: false
  half_precision: false
  plots: true

output:
  project_directory: /kaggle/working
  run_name: wrist_privid_v3_b1_s42
  save_checkpoints: true
  checkpoint_save_period: 10
  save_plots: true
  save_results_csv: true
  exist_ok: false

controlled_comparison:
  reference_experiment: V3-B0-S42

  only_intended_change:
    from: offline_brightness_augmented
    from_training_images: 28408
    to: original_only_online_augmentation
    to_training_images: 14204

  preserved_from_v2:
    image_size: 1024
    epochs: 100
    patience: 50
    batch_size: 16
    optimizer: SGD
    initial_learning_rate: 0.01
    final_learning_rate_fraction: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    warmup_epochs: 3.0
    box_gain: 7.5
    classification_gain: 2.5
    dfl_gain: 1.5
    classification_positive_weight: 0.0
    mosaic: 1.0
    close_mosaic_epochs: 15
    seed: 42

verification:
  required_branch: v3-strong-baseline
  required_experiment_id: V3-B1-S42

  expected_train_images: 14204
  expected_validation_images: 4094

  forbidden_training_prefix: "aug_"

  require_git_commit: true
  require_checkpoint_sha256: true
  require_saved_training_args: true
  require_results_csv: true

  official_test_split_must_remain_unused: true