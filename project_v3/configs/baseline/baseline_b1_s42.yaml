# Wrist-PriViD V3
# Experiment: V3-B1-S42
# Strong single-view baseline using original training images only

experiment:
  id: V3-B1-S42
  stage: strong_single_view_baseline
  description: >
    YOLO11s baseline trained on the 14,204 original GRAZPEDWRI-DX
    training images with online augmentation. Offline brightness copies
    are excluded.
  branch: v3-strong-baseline
  seed: 42
  test_partition_allowed: false

data:
  dataset_name: GRAZPEDWRI-DX
  number_of_classes: 9

  # These files will be generated inside the Kaggle notebook.
  dataset_root_environment_variable: GRAZPEDWRI_ROOT
  runtime_train_list: /kaggle/working/wrist_privid_v3/train_original.txt
  runtime_data_yaml: /kaggle/working/wrist_privid_v3/grazped_original_only.yaml

  train_source: original_only
  train_directory: data/images/train_aug
  train_allowed_prefix: "orig_"
  train_forbidden_prefix: "aug_"
  expected_train_images: 14204

  validation_directory: data/images/valid
  expected_validation_images: 4094

  class_names:
    0: boneanomaly
    1: bonelesion
    2: foreignbody
    3: fracture
    4: metal
    5: periostealreaction
    6: pronatorsign
    7: softtissue
    8: text

model:
  architecture: yolo11s
  pretrained_weights: yolo11s.pt
  number_of_classes: 9
  custom_modules_enabled: false

environment_flags:
  USE_FOCALER: "0"
  USE_WHFE: "0"
  USE_CBLOSS: "0"
  USE_MCAUX: "0"

training:
  image_size: 640
  epochs: 250
  batch_size: 16
  device: 0
  workers: 4

  optimizer: SGD
  initial_learning_rate: 0.01
  final_learning_rate_fraction: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cosine_learning_rate: true

  patience: 75
  amp: true
  deterministic: true
  seed: 42
  close_mosaic_epochs: 15

loss:
  box_gain: 7.5
  classification_gain: 0.5
  dfl_gain: 1.5
  classification_positive_weight: 1.0

augmentation:
  # X-rays are grayscale, so hue and saturation changes are disabled.
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.20

  degrees: 5.0
  translate: 0.05
  scale: 0.20
  shear: 0.0
  perspective: 0.0

  # Flips are disabled because laterality markers and the text class
  # would become anatomically or semantically inconsistent.
  flip_vertical: 0.0
  flip_horizontal: 0.0

  mosaic: 0.5
  mixup: 0.0
  copy_paste: 0.0
  erasing: 0.0

validation:
  enabled: true
  split: val
  image_size: 640
  confidence_threshold: 0.001
  iou_threshold: 0.70
  maximum_detections: 300
  test_time_augmentation: false
  half_precision: false
  plots: true

output:
  project_directory: /kaggle/working
  run_name: wrist_privid_v3_b1_s42
  save_checkpoints: true
  checkpoint_save_period: 10
  save_plots: true
  save_results_csv: true
  exist_ok: false

verification:
  required_branch: v3-strong-baseline
  required_experiment_id: V3-B1-S42
  expected_train_images: 14204
  expected_validation_images: 4094
  forbidden_training_prefix: "aug_"
  require_git_commit: true
  require_checkpoint_sha256: true
  require_saved_training_args: true
  require_results_csv: true
  official_test_split_must_remain_unused: true