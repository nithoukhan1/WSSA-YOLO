# WSSA-YOLO11 with Frequency-Aware Feature Fusion
# Backbone: WSSA (Wavelet Sub-band Selective Attention) after each C3k2
# Neck: FreqFusionUp replaces nn.Upsample + Concat in the upsample path
# Head: Standard Detect (unchanged)

nc: 9
scales:
  s: [0.50, 0.50, 1024]

# ════════════════════════════════════════════════════════════════
# BACKBONE — identical to WSSA-YOLO v1 (unchanged)
# ════════════════════════════════════════════════════════════════
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  - P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, WSSA, [256]]                # 3  ★ WSSA
  - [-1, 1, Conv, [256, 3, 2]]          # 4  - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 5
  - [-1, 1, WSSA, [512]]                # 6  ★ WSSA (P3 skip target)
  - [-1, 1, Conv, [512, 3, 2]]          # 7  - P4/16
  - [-1, 2, C3k2, [512, True]]          # 8
  - [-1, 1, WSSA, [512]]                # 9  ★ WSSA (P4 skip target)
  - [-1, 1, Conv, [1024, 3, 2]]         # 10 - P5/32
  - [-1, 2, C3k2, [1024, True]]         # 11
  - [-1, 1, WSSA, [1024]]               # 12 ★ WSSA
  - [-1, 1, SPPF, [1024, 5]]            # 13
  - [-1, 2, C2PSA, [1024]]              # 14 (P5 skip target)

# ════════════════════════════════════════════════════════════════
# HEAD — FreqFusionUp replaces Upsample+Concat in upsample path
# ════════════════════════════════════════════════════════════════
# Previous v1 had:
#   15: nn.Upsample     ←  replaced
#   16: Concat [-1, 9]  ←  replaced  } → merged into FreqFusionUp at layer 15
#   17: C3k2            →  becomes layer 16
#   18: nn.Upsample     ←  replaced
#   19: Concat [-1, 6]  ←  replaced  } → merged into FreqFusionUp at layer 17
#   20: C3k2            →  becomes layer 18
#   ... (all subsequent indices shift by -2)

head:
  # ── Upsample path (FreqFusionUp = frequency-aware upsample + concat) ──
  - [[-1, 9], 1, FreqFusionUp, []]             # 15 ★ replaces Upsample+Concat
  - [-1, 2, C3k2, [512, False]]                # 16

  - [[-1, 6], 1, FreqFusionUp, []]             # 17 ★ replaces Upsample+Concat
  - [-1, 2, C3k2, [256, False]]                # 18   (P3/8-small output)

  # ── Downsample path (unchanged logic, only indices shifted by -2) ──
  - [-1, 1, Conv, [256, 3, 2]]                 # 19
  - [[-1, 16], 1, Concat, [1]]                 # 20   cat with layer 16
  - [-1, 2, C3k2, [512, False]]                # 21   (P4/16-medium output)

  - [-1, 1, Conv, [512, 3, 2]]                 # 22
  - [[-1, 14], 1, Concat, [1]]                 # 23   cat with layer 14 (P5)
  - [-1, 2, C3k2, [1024, True]]                # 24   (P5/32-large output)

  # ── Detection head ──
  - [[18, 21, 24], 1, Detect, [nc]]            # 25