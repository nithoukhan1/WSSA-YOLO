# PWFrac-YOLOv11s: EMA×4 + Slim-Neck (VoVGSCSP/GSConv) + Focaler-CIoU loss
# Backbone unchanged. Neck replaces C3k2→VoVGSCSP, Conv→GSConv, and adds EMA at 4 positions.
nc: 9
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]                          # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 11
  - [[-1, 6], 1, Concat, [1]]                        # 12
  - [-1, 2, VoVGSCSP, [512, False]]                  # 13  Slim
  - [-1, 1, EMA, [512]]                              # 14 ★ EMA
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 15
  - [[-1, 4], 1, Concat, [1]]                        # 16
  - [-1, 2, VoVGSCSP, [256, False]]                  # 17  Slim
  - [-1, 1, EMA, [256]]                              # 18 ★ EMA  (head P3)
  - [-1, 1, GSConv, [256, 3, 2]]                     # 19  Slim
  - [[-1, 14], 1, Concat, [1]]                       # 20  cat with EMA @ 14
  - [-1, 2, VoVGSCSP, [512, False]]                  # 21  Slim
  - [-1, 1, EMA, [512]]                              # 22 ★ EMA  (head P4)
  - [-1, 1, GSConv, [512, 3, 2]]                     # 23  Slim
  - [[-1, 10], 1, Concat, [1]]                       # 24
  - [-1, 2, VoVGSCSP, [1024, True]]                  # 25  Slim
  - [-1, 1, EMA, [1024]]                             # 26 ★ EMA  (head P5)
  - [[18, 22, 26], 1, Detect, [nc]]                  # 27