# WSSA-YOLO11 object detection model with Wavelet Sub-band Selective Attention
# 4 WSSA blocks inserted after each C3k2 in the backbone

# Parameters
nc: 9  # overridden by data.yaml at training time
scales:
  s: [0.50, 0.50, 1024]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, WSSA, [256]]                # 3  ★ NEW
  - [-1, 1, Conv, [256, 3, 2]]          # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 5
  - [-1, 1, WSSA, [512]]                # 6  ★ NEW
  - [-1, 1, Conv, [512, 3, 2]]          # 7-P4/16
  - [-1, 2, C3k2, [512, True]]          # 8
  - [-1, 1, WSSA, [512]]                # 9  ★ NEW
  - [-1, 1, Conv, [1024, 3, 2]]         # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 11
  - [-1, 1, WSSA, [1024]]               # 12 ★ NEW
  - [-1, 1, SPPF, [1024, 5]]            # 13
  - [-1, 2, C2PSA, [1024]]              # 14

# Head — identical logic to yolo11.yaml, only indices shifted
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 9], 1, Concat, [1]]                    # 16: cat P4 (was layer 6, now 9)
  - [-1, 2, C3k2, [512, False]]                  # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 6], 1, Concat, [1]]                    # 19: cat P3 (was layer 4, now 6)
  - [-1, 2, C3k2, [256, False]]                  # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 21
  - [[-1, 17], 1, Concat, [1]]                   # 22: cat head P4 (was 13, now 17)
  - [-1, 2, C3k2, [512, False]]                  # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 24
  - [[-1, 14], 1, Concat, [1]]                   # 25: cat P5 (was 10, now 14)
  - [-1, 2, C3k2, [1024, True]]                  # 26 (P5/32-large)

  - [[20, 23, 26], 1, Detect, [nc]]              # 27: Detect (was [16,19,22])