# FWNet-YOLO11 — WHFE-enhanced for pediatric wrist fracture detection
# Two WHFE insertions in the neck at P3 and P4 detail levels.

nc: 9
scales:
  s: [0.50, 0.50, 1024]

backbone:  # standard YOLOv11s — UNCHANGED (critical for pretrained weight transfer)
  - [-1, 1, Conv,  [64, 3, 2]]      # 0  P1/2
  - [-1, 1, Conv,  [128, 3, 2]]     # 1  P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]  # 2
  - [-1, 1, Conv,  [256, 3, 2]]     # 3  P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]  # 4
  - [-1, 1, Conv,  [512, 3, 2]]     # 5  P4/16
  - [-1, 2, C3k2,  [512, True]]     # 6
  - [-1, 1, Conv,  [1024, 3, 2]]    # 7  P5/32
  - [-1, 2, C3k2,  [1024, True]]    # 8
  - [-1, 1, SPPF,  [1024, 5]]       # 9
  - [-1, 2, C2PSA, [1024]]          # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12
  - [-1, 2, C3k2, [512, False]]                   # 13  (P4 neck feature)
  - [-1, 1, WHFE, [512]]                          # 14  ★ WHFE at P4 level

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, Concat, [1]]                     # 16
  - [-1, 2, C3k2, [256, False]]                   # 17  (P3 neck feature)
  - [-1, 1, WHFE, [256]]                          # 18  ★ WHFE at P3 level — Detect input

  - [-1, 1, Conv, [256, 3, 2]]                    # 19
  - [[-1, 14], 1, Concat, [1]]                    # 20  (concats with P4-WHFE output)
  - [-1, 2, C3k2, [512, False]]                   # 21  (P4 detect feature) — Detect input

  - [-1, 1, Conv, [512, 3, 2]]                    # 22
  - [[-1, 10], 1, Concat, [1]]                    # 23
  - [-1, 2, C3k2, [1024, True]]                   # 24  (P5 detect feature) — Detect input

  - [[18, 21, 24], 1, Detect, [nc]]               # 25